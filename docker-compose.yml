services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-eventos
    restart: unless-stopped

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: eventos
      RABBITMQ_DEFAULT_PASS: eventos_dev

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data: